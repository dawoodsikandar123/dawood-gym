<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Login - Dawood Gym</title>
<link rel="stylesheet" href="style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Outfit', sans-serif;
  background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color: #f1f5f9;
  overflow: hidden;
}

.login-box {
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  padding: 50px 40px;
  width: 420px;
  text-align:center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  animation: boxFadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.gym-icon {
  margin-bottom: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 90px;
  height: 90px;
  background: rgba(192, 57, 43, 0.05);
  border-radius: 50%;
  border: 1px solid rgba(192, 57, 43, 0.2);
  box-shadow: 0 0 20px rgba(192, 57, 43, 0.1);
  transition: all 0.3s ease;
}

.gym-icon:hover {
  transform: scale(1.05) rotate(5deg);
  background: rgba(192, 57, 43, 0.1);
  box-shadow: 0 0 30px rgba(192, 57, 43, 0.2);
}

.gym-icon svg {
  width: 50px;
  height: 50px;
}

h2 {
  color: #f8fafc;
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 6px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

p {
  color: #64748b;
  font-size: 13.5px;
  margin-bottom: 30px;
  font-weight: 500;
}

.form-group {
  text-align:left;
  margin-bottom: 20px;
}

.form-group label {
  display:block;
  color: #94a3b8;
  font-size: 12.5px;
  margin-bottom: 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input {
  width:100%;
  padding: 12px 16px;
  background: #090d16;
  border: 1px solid #1e293b;
  border-radius: 8px;
  color: #f8fafc;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s ease;
}

.form-group input:focus {
  outline:none;
  border-color: #c0392b;
  box-shadow: 0 0 10px rgba(192, 57, 43, 0.3);
}

.btn-login {
  width:100%;
  padding: 13px;
  background: #c0392b;
  color: white;
  border:none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor:pointer;
  margin-top: 10px;
  letter-spacing: 1px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(192, 57, 43, 0.2);
}

.btn-login:hover {
  background: #a93226;
  box-shadow: 0 6px 20px rgba(192, 57, 43, 0.4);
  transform: translateY(-1px);
}

.error-msg {
  background: rgba(231, 76, 60, 0.1);
  border: 1px solid rgba(231, 76, 60, 0.2);
  color: #ef4444;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 20px;
  font-weight: 500;
  display:none;
  animation: shake 0.3s ease-in-out;
}

@keyframes boxFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
</style>

  <h2>Dawood Gym</h2>
  <p>Admin Login Panel</p>

  <div class="error-msg" id="errMsg">⚠️ Invalid credentials! Please try again.</div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>
  <button class="btn-login" onclick="doLogin()">LOGIN</button>
</div>

<script>
function doLogin(){
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  if(u === 'dawood' && p === 'dawood123'){
    sessionStorage.setItem('loggedIn','true'); window.location.href = 'dashboard.html';
  } else {
    document.getElementById('errMsg').style.display = 'block';
  }
}
document.addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
</script>
</body></html>
